# Copia para config.yaml e ajusta. Só precisas de pôr o que queres mudar.
workdir: ./data

transcribe:
  model: small          # tiny | base | small | medium | large-v3  (large-v3 se tiveres GPU NVIDIA)
  device: auto          # auto | cpu | cuda
  language: null        # null = deteção automática; "pt", "en", ...

analyze:
  backend: api          # api (ANTHROPIC_API_KEY) | claude_code (usa a tua subscrição via `claude -p`)
  model: claude-opus-5-5
  effort: medium        # low | medium | high
  max_clips: 8
  min_score: 65         # clips abaixo disto são descartados
  min_duration: 20
  max_duration: 75
  metadata_language: pt-PT
  channel_context: ""   # ex: "Streamer PT de FPS, humor ácido, público 16-25"

render:
  layout: blur          # blur (seguro p/ tudo) | crop (pessoa ao centro) | split (facecam em cima + jogo em baixo)
  crop_x: 0.5
  split:                # frações do vídeo original: [x, y, largura, altura]
    facecam: [0.0, 0.0, 0.25, 0.25]
    gameplay: [0.125, 0.0, 0.75, 1.0]
    facecam_height: 640
  silence_gap: 1.0      # corta pausas maiores que 1s (0 desliga)
  captions: true
  words_per_caption: 3
  font: Arial
  font_size: 82
  hook_seconds: 3.0
